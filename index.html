<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite</title>
    <script>
      (function () {
        try {
          var setting = localStorage.getItem("supplyhub:theme");
          if (setting === "light" || setting === "dark") {
            document.documentElement.setAttribute("data-theme", setting);
          }
        } catch (e) {
          // localStorage unavailable — falls through to the prefers-color-scheme default
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
